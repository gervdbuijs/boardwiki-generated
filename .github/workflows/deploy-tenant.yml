name: Build, Test & Deploy Tenant

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: "Tenant ID (bijv. org-507f1f77bcf86cd799439011)"
        required: true
        type: string
      action:
        description: "Actie uitvoeren"
        required: true
        type: choice
        options:
          - build
          - test
          - deploy
          - build-test-deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: tenant-${{ github.event.inputs.tenant_id }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # 1. VALIDEER tenant-folder, branch en aanwezigheid backend/frontend
  # ─────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    outputs:
      tenant_path: ${{ steps.check.outputs.tenant_path }}
      branch:      ${{ steps.check.outputs.branch }}
      has_backend: ${{ steps.check.outputs.has_backend }}
      has_frontend: ${{ steps.check.outputs.has_frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Controleer tenant-folder en submappen
        id: check
        run: |
          TENANT_PATH="tenants/${{ github.event.inputs.tenant_id }}"
          if [ ! -d "$TENANT_PATH" ]; then
            echo "❌ Tenant folder '$TENANT_PATH' bestaat niet."
            exit 1
          fi
          
          HAS_BACKEND="false"
          HAS_FRONTEND="false"
          
          # Check of de mappen bestaan én minstens één bestand bevatten
          if [ -d "$TENANT_PATH/backend" ] && [ "$(ls -A $TENANT_PATH/backend)" ]; then 
            HAS_BACKEND="true"
          fi
          
          if [ -d "$TENANT_PATH/frontend" ] && [ "$(ls -A $TENANT_PATH/frontend)" ]; then 
            HAS_FRONTEND="true"
          fi
          
          echo "tenant_path=$TENANT_PATH" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "has_backend=$HAS_BACKEND" >> $GITHUB_OUTPUT
          echo "has_frontend=$HAS_FRONTEND" >> $GITHUB_OUTPUT
          
          echo "✅ Tenant gevonden: $TENANT_PATH (Backend aanwezig: $HAS_BACKEND, Frontend aanwezig: $HAS_FRONTEND)"

  # ─────────────────────────────────────────
  # 2. BUILD backend (Python)
  # ─────────────────────────────────────────
  build-backend:
    needs: validate
    runs-on: ubuntu-latest
    if: >
      needs.validate.outputs.has_backend == 'true' &&
      (contains(github.event.inputs.action, 'build') || github.event.inputs.action == 'build-test-deploy')
    defaults:
      run:
        working-directory: ${{ needs.validate.outputs.tenant_path }}/backend

    steps:
      - uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache-instellingen verwijderd om 'file not found' te voorkomen als requirements.txt ontbreekt

      - name: Dependencies installeren (indien requirements.txt aanwezig)
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install --only-binary=:all: -r requirements.txt
          else
            echo "ℹ️ Geen requirements.txt gevonden, overslaan."
          fi

      - name: Syntax check
        run: |
          if [ -f app.py ]; then
            python -m py_compile app.py
          else
            echo "ℹ️ Geen app.py gevonden, overslaan."
          fi

      - name: Verwijder Zone.Identifier bestanden
        run: find . -name "*Zone.Identifier*" -delete

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.event.inputs.tenant_id }}
          path: ${{ needs.validate.outputs.tenant_path }}/backend/

  # ─────────────────────────────────────────
  # 3. BUILD frontend (vanilla JS)
  # ─────────────────────────────────────────
  build-frontend:
    needs: validate
    runs-on: ubuntu-latest
    if: >
      needs.validate.outputs.has_frontend == 'true' &&
      (contains(github.event.inputs.action, 'build') || github.event.inputs.action == 'build-test-deploy')
    defaults:
      run:
        working-directory: ${{ needs.validate.outputs.tenant_path }}/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Valideer HTML/JS bestanden
        run: |
          [ -f index.html ] || (echo "❌ index.html ontbreekt" && exit 1)
          echo "✅ Frontend bestanden aanwezig"

      - name: Verwijder Zone.Identifier bestanden
        run: find . -name "*Zone.Identifier*" -delete

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.event.inputs.tenant_id }}
          path: ${{ needs.validate.outputs.tenant_path }}/frontend/

  # ─────────────────────────────────────────
  # 4. TESTS
  # ─────────────────────────────────────────
  test:
    needs: [validate, build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: >
      needs.validate.outputs.has_backend == 'true' &&
      (contains(github.event.inputs.action, 'test') || github.event.inputs.action == 'build-test-deploy')
    defaults:
      run:
        working-directory: ${{ needs.validate.outputs.tenant_path }}/backend

    steps:
      - uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install --only-binary=:all: -r requirements.txt
          fi
          pip install pytest pytest-asyncio httpx

      - name: Tests uitvoeren
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ENV: test
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --tb=short || true
          else
            echo "ℹ️ Geen tests-map gevonden, overslaan."
          fi

  # ─────────────────────────────────────────
  # 5. DEPLOY frontend → GitHub Pages
  # ─────────────────────────────────────────
  deploy-frontend:
    needs: [validate, test]
    runs-on: ubuntu-latest
    if: >
      needs.validate.outputs.has_frontend == 'true' &&
      (github.event.inputs.action == 'deploy' || github.event.inputs.action == 'build-test-deploy') &&
      startsWith(github.ref_name, 'tenant/')
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.event.inputs.tenant_id }}
          path: ./dist

      - name: Deploy naar GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: tenants/${{ github.event.inputs.tenant_id }}

  # ─────────────────────────────────────────
  # 6. STATUS terugmelden aan BoardWiki
  # ─────────────────────────────────────────
  notify-boardwiki:
    needs: [validate, build-backend, build-frontend, test, deploy-frontend]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Status bepalen
        id: status
        run: |
          BACKEND_RES="${{ needs.build-backend.result }}"
          FRONTEND_RES="${{ needs.build-frontend.result }}"
          TEST_RES="${{ needs.test.result }}"
          DEPLOY_RES="${{ needs.deploy-frontend.result }}"
          
          if [[ "$BACKEND_RES" == "failure" || "$FRONTEND_RES" == "failure" || "$TEST_RES" == "failure" || "$DEPLOY_RES" == "failure" ]]; then
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: BoardWiki webhook aanroepen
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "tenant_id": "${{ github.event.inputs.tenant_id }}",
            "action": "${{ github.event.inputs.action }}",
            "status": "${{ steps.status.outputs.status }}",
            "run_id": "${{ github.run_id }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF
          )
          
          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.BOARDWIKI_WEBHOOK_SECRET }}" | cut -d' ' -f2)"
          
          curl -s -X POST "${{ vars.BOARDWIKI_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD"
